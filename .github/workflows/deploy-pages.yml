name: Deploy site to GitHub Pages

# Publishes the static site/ directory to GitHub Pages. The site is fully
# static (no build step) and fetches live 2026 data from the MLB Stats API in
# the browser, so there's nothing to compile — we just upload site/.

on:
  push:
    branches:
      - main
      - claude/baseball-analysis-database-c13ij9
    paths:
      - "site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}   # lets you deploy on demand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages automatically (needs Actions "read and write"
          # permissions on the repo). If this fails, enable Pages once by hand:
          # Settings → Pages → Source → GitHub Actions.
          enablement: true

      - name: Upload site/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
